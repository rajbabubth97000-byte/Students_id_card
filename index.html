<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Card Design</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="id-card">
        <!-- Logo Section -->
        <div class="header">
            <div class="logo-box">
                <span class="logo-icon"></span> 
                <div class="logo-text">
                    <strong>STUDENT ID CARD</strong>
                </div>
            </div>
        </div>

        <!-- Profile Image -->
        <div class="profile-container">
            <div class="profile-border">
                <img src="RK.jpg" alt="RAJ KUMAR">
            </div>
        </div>

        <!-- Name and Title -->
        <div class="info-section">
            <h1>RAJ KUMAR</h1>
            <div class="badge">M J K COLLEGE BETTIAH</div>
        </div>

        <!-- Details -->
        <div class="details">
            <div class="row">
                <span class="label">ID No</span>
                <span class="value">: 231149</span>
            </div>
            <div class="row">
                <span class="label">Email</span>
                <span class="value">  :   rajsonu97000@gmail.com</span>
            </div>
            <div class="row">
                <span class="label">Depart</span>
                <span class="value">: BCA</span>
            </div>
            <div class="row">
                <span class="label">Phone</span>
                <span class="value">: 9955636341</span>
            </div>
        </div>

        <!-- Barcode Placeholder -->
        <div class="barcode">
            <div class="barcode-lines"></div>
        </div>
    </div>

</body>
</html>
